[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-trainfree"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["torch", "timm", "numpy", "Pillow", "PyYAML", "scipy", "numba"]

[project.optional-dependencies]
test = ["pytest"]
selfref = []

[project.scripts]
pathology-trainfree = "pathology_trainfree.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pathology_trainfree*"]
